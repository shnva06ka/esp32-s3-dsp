; ============================================================
;  ESP32-S3-DSP — Multi-Environment Config
; ============================================================
[platformio]
default_envs = yd_esp32s3_n16r8
src_dir      = .

; ─────────────────────────────────────────────────────────────
;  Environment 1: ESP32-S3 Main Audio Processor
; ─────────────────────────────────────────────────────────────
[env:yd_esp32s3_n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Source Filter (only compile S3 src/ files) ───────────────
build_src_filter =
    +<src/*>

; ── Flash / PSRAM ───────────────────────────────────────────
board_build.flash_size       = 16MB
board_build.flash_mode       = qio
board_build.arduino.memory_type = qio_opi        ; enables OPI PSRAM (8 MB)
board_upload.flash_size      = 16MB

; ── Partition table (16 MB layout with OTA + SPIFFS) ────────
board_build.partitions = partitions_16MB.csv

; ── Build flags ─────────────────────────────────────────────
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; I2S_NUM_0: PCM1808 ADC (capture) + PCM5102A DAC (playback)
    -DI2S_NUM=I2S_NUM_0
    -DI2S_MCLK_PIN=4
    -DI2S_BCK_PIN=5
    -DI2S_WS_PIN=6
    -DI2S_DOUT_PIN=7
    -DI2S_DIN_PIN=15
    ; I2S_NUM_1: Bluetooth Slave Receiver (from ESP32-WROOM)
    -DI2S_BT_NUM=I2S_NUM_1
    -DI2S_BT_BCK_PIN=16
    -DI2S_BT_WS_PIN=17
    -DI2S_BT_DIN_PIN=18
    ; Audio config
    -DSAMPLE_RATE=48000
    -DBUFFER_FRAMES=256
    ; Optimisation
    -O2
    -DCORE_DEBUG_LEVEL=1

; ── Libraries ───────────────────────────────────────────────
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    mathieucarbou/ESPAsyncWebServer @ ^3.0.6
    mathieucarbou/AsyncTCP @ ^3.0.0

; ── Upload / Monitor ────────────────────────────────────────
upload_port    = COM8
monitor_port   = COM8
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default

; ============================================================
;  ESP32-WROOM Bluetooth A2DP Bridge — 30-pin DevKit V1
; ============================================================
[env:wroom_bt]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

; ── Partition table (3MB App for Bluetooth A2DP) ───────────
board_build.partitions = huge_app.csv

; ── Source Filter (only compile wroom_bt_bridge, exclude S3) ─
build_src_filter =
    +<wroom_bt_bridge/*>

; ── Libraries ───────────────────────────────────────────────
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP/archive/refs/heads/main.zip
    bblanchon/ArduinoJson @ ^6.21.4

; ── Upload / Monitor ────────────────────────────────────────
upload_port    = COM9
monitor_port   = COM9
upload_speed   = 115200
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default


