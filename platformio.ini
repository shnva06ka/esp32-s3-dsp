[platformio]
default_envs = yd_esp32s3_n16r8
src_dir      = .

[env:yd_esp32s3_n16r8]
platform  = espressif32 @ ~7.0.1
board     = esp32-s3-devkitc-1
framework = arduino

build_src_filter =
    +<src/*>

board_build.flash_size       = 16MB
board_build.flash_mode       = dio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size      = 16MB

board_build.partitions = partitions_16MB.csv
extra_scripts = pre:tools/build_html_hook.py
lib_ldf_mode  = deep+

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DI2S_NUM=I2S_NUM_0
    -DI2S_MCLK_PIN=4
    -DI2S_BCK_PIN=5
    -DI2S_WS_PIN=6
    -DI2S_DOUT_PIN=7
    -DI2S_DIN_PIN=15
    -DI2S_BT_NUM=I2S_NUM_1
    -DI2S_BT_BCK_PIN=16
    -DI2S_BT_WS_PIN=17
    -DI2S_BT_DIN_PIN=18
    -DSAMPLE_RATE=96000
    -DBUFFER_FRAMES=256
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -Isrc
    -Wl,--wrap=esp_wifi_init
    -Wl,--wrap=sys_mbox_new
    -Wl,--wrap=tcp_alloc
    -Wl,--wrap=tcp_enqueue_flags
    -Wl,--wrap=tcp_recved
    -Wl,--wrap=tcp_close

lib_deps =
    bblanchon/ArduinoJson @ 6.21.6
    mathieucarbou/ESPAsyncWebServer @ 3.6.0
    mathieucarbou/AsyncTCP @ 3.3.2
    WiFi
    Preferences

upload_port    = COM8
upload_speed   = 115200
monitor_port   = COM8
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default

[env:wroom_bt]
platform  = espressif32 @ ~7.0.1
board     = esp32doit-devkit-v1
framework = arduino

board_build.partitions = huge_app.csv

build_src_filter =
    +<wroom_bt_bridge/*>

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP/archive/refs/tags/v1.8.12.zip

upload_port    = COM9
monitor_port   = COM9
upload_speed   = 115200
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default
